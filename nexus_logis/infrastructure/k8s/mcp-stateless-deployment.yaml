apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-stateless-server
  labels:
    app: nexus-logis
    component: mcp-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexus-logis
      component: mcp-server
  template:
    metadata:
      labels:
        app: nexus-logis
        component: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: cngsm/mcp-server:v2.0.0-stateless-rc
        ports:
        - containerPort: 8080
        env:
        - name: MCP_STATELESS_MODE
          value: "true"
        - name: MCP_SPEC_VERSION
          value: "2026-07-28-RC"
        # Garantindo ausência de afinidade de sessão
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-stateless-service
spec:
  selector:
    app: nexus-logis
    component: mcp-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-stateless-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Roteamento baseado nos novos cabeçalhos stateless do MCP
    nginx.ingress.kubernetes.io/server-snippet: |
      location / {
        if ($http_mcp_method = "server/discover") {
          proxy_pass http://mcp-stateless-service.default.svc.cluster.local:80;
        }
        if ($http_mcp_name = "PSRO_Auction") {
          proxy_pass http://mcp-stateless-service.default.svc.cluster.local:80;
        }
      }
spec:
  rules:
  - host: nexus.logis.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-stateless-service
            port:
              number: 80
